<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Seat Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
            color: #222;
        }

        h1 {
            text-align: center;
            color: #1560bd;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .controls input {
            width: 100px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 7px;
            font-size: 14px;
        }

        .controls button {
            padding: 10px 22px;
            border: 1px solid #1560bd;
            border-radius: 7px;
            background: white;
            color: #1560bd;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .controls button:hover {
            background: #1560bd;
            color: white;
        }

        .layouts {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
        }

        .layout-card {
            width: 280px;
            padding: 15px;
            background: white;
            border: 2px solid #1560bd;
            border-radius: 12px;
            box-shadow: 0 4px 10px #00000012;
        }

        .layout-card h2 {
            text-align: center;
            color: #1560bd;
            margin: 0 0 15px;
            font-size: 20px;
        }

        .seat-info {
            text-align: center;
            font-size: 12px;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .bus {
            padding: 20px 8px 15px;
            border: 3px solid #1d2c4e;
            border-radius: 40px 40px 12px 12px;
            background: #f8fafc;
        }

        .driver {
            width: 76px;
            height: 38px;
            margin: 5px 0px 20px 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1d2c4e;
            color: white;
            border-radius: 7px;
            font-size: 11px;
            font-weight: bold;
        }

        .seats {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }

        .seat-row {
            display: grid;
            grid-template-columns: 38px 38px 38px 38px 38px;
            gap: 5px;
            justify-content: center;
            align-items: center;
        }

        .seat,
        .empty {
            width: 38px;
            height: 38px;
            min-width: 38px;
            min-height: 38px;
        }

        .seat {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #1560bd;
            border: 1px solid #104b96;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        .seat.b {
            background: #1d8a58;
            border-color: #146b43;
        }

        .seat.c {
            background: #8c0f3b;
            border-color: #6d0b2d;
        }

        .empty {
            visibility: hidden;
        }

        .aisle {
            width: 18px;
            height: 38px;
        }

        .rear-label {
            margin: 15px 0 8px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #555;
        }

        .c-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .c-row .seat {
            flex: 0 0 38px;
            width: 38px;
            min-width: 38px;
            height: 38px;
        }

        .legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 25px auto;
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .legend-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .message {
            text-align: center;
            margin: 15px;
            color: #8c0f3b;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>Bus Seat Layout</h1>

    <div class="controls">
        <label for="totalSeats">Total Seats:</label>
        <input type="number" id="totalSeats" min="7" max="100" value="26">
        <button type="button" onclick="updateLayout()">Generate</button>
    </div>

    <div class="layouts" id="layouts"></div>
    <div class="message" id="message"></div>

    <div class="legend">
        <span>
            <i class="legend-box" style="background:#1560bd"></i>
            A Side
        </span>
        <span>
            <i class="legend-box" style="background:#1d8a58"></i>
            B Side
        </span>
        <span>
            <i class="legend-box" style="background:#8c0f3b"></i>
            C Side
        </span>
    </div>

    <script>
        function makeLayout(total) {
            const sideSeats = total - 5;
            const remainder = sideSeats % 4;

            let aTotal = Math.floor(sideSeats / 4) * 2;
            let bTotal = aTotal;
            let type = 1;

            if (remainder === 1) {
                aTotal += 1;
                type = 1;
            } else if (remainder === 2) {
                bTotal += 2;
                type = 2;
            } else if (remainder === 3) {
                aTotal += 1;
                bTotal += 2;
                type = 3;
            }

            const rows = Math.max(
                Math.ceil(aTotal / 2) + (remainder === 2 ? 1 : 0),
                Math.ceil(bTotal / 2)
            );

            let html = `
        <div class="layout-card">
            <h2>Type-${type}</h2>
            <div class="seat-info">
                Total Seats: ${total}<br>
                A Side: ${aTotal} |
                B Side: ${bTotal} |
                C Side: 5
            </div>
            <div class="bus">
                <div class="driver">DRIVER</div>
                <div class="seats">
    `;

            let aNumber = 1;
            let bNumber = 1;

            for (let i = 0; i < rows; i++) {
                let a1 = '<div class="empty"></div>';
                let a2 = '<div class="empty"></div>';
                let b1 = '<div class="empty"></div>';
                let b2 = '<div class="empty"></div>';

                if (remainder === 2 && i === 0) {
                    // Type-2: A side starts from the second row.
                } else if ((remainder === 1 || remainder === 3) && i === 0) {
                    // Type-1 and Type-3: first row has one A seat.
                    if (aNumber <= aTotal) {
                        a1 = `<div class="seat">A${aNumber++}</div>`;
                    }
                } else {
                    if (aNumber <= aTotal) {
                        a1 = `<div class="seat">A${aNumber++}</div>`;
                    }
                    if (aNumber <= aTotal) {
                        a2 = `<div class="seat">A${aNumber++}</div>`;
                    }
                }

                // Type-1: B starts from the second row.
                if (!(remainder === 1 && i === 0)) {
                    if (bNumber <= bTotal) {
                        b1 = `<div class="seat b">B${bNumber++}</div>`;
                    }
                    if (bNumber <= bTotal) {
                        b2 = `<div class="seat b">B${bNumber++}</div>`;
                    }
                }

                html += `
            <div class="seat-row">
                ${a1}
                ${a2}
                <div class="aisle"></div>
                ${b1}
                ${b2}
            </div>
        `;
            }

            html += `
                </div>
               <br>
                <div class="c-row">
                    <div class="seat c">C1</div>
                    <div class="seat c">C2</div>
                    <div class="seat c">C3</div>
                    <div class="seat c">C4</div>
                    <div class="seat c">C5</div>
                </div>
            </div>
        </div>
    `;

            return html;
        }

        function updateLayout() {
            const total = Number(
                document.getElementById("totalSeats").value
            );

            const layouts = document.getElementById("layouts");
            const message = document.getElementById("message");

            if (!Number.isInteger(total) || total < 7 || total > 100) {
                layouts.innerHTML = "";
                message.textContent =
                    "Please enter total seats between 7 and 100.";
                return;
            }

            message.textContent = "";
            layouts.innerHTML = makeLayout(total);
        }

        document.getElementById("totalSeats").addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    updateLayout();
                }
            }
        );

        updateLayout();
    </script>

</body>

</html>
